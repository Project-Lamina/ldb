[package]
name = "lamina-ldb"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Eira <eira@nornity.com>"]
description = "ldb - gdb/lldb alternative. Debugs Linux x86_64 ELF and nothing else; other platforms build and refuse by name. Own DWARF 2-5 reader: breakpoints, stepping, .eh_frame backtraces. Built for Lamina output, reads gcc and ras DWARF too."
license = "Apache-2.0"
keywords = ["debugger", "dwarf", "elf", "ptrace"]
categories = ["development-tools::debugging"]
repository = "https://github.com/Project-Lamina/ldb"

[lib]
name = "ldb"
path = "src/lib.rs"

[[bin]]
name = "ldb"
path = "src/main.rs"

[dependencies]
log = "0.4"

# libc is only reachable from the ptrace half of the crate, which does not
# build off Linux x86_64 at all.
[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
libc = "0.2"
