name: test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: "test (ubuntu-latest)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # ldb drives a real inferior under ptrace and reads the DWARF gcc writes,
      # so the tests need a compiler and a debugger of their own to compare with.
      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc gdb
      - name: Report tool availability
        run: |
          for tool in gcc gdb clang objdump readelf; do
            printf '%-12s %s\n' "$tool" "$(command -v $tool || echo MISSING)"
          done
      - name: Build
        run: cargo build --release
      # tests/lamina_binary.rs skips itself without a lamina build beside this
      # checkout, so say how many ran rather than reading a green tick as full
      # coverage. Set LAMINA to a compiler path to cover them here too.
      - name: Test
        run: cargo test --release -- --format terse
